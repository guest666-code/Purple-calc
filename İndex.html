    <!-- Calculator Logic Script -->
    <script>
        // State variables
        let currentExpression = '';
        let currentResult = '0';
        let bracketOpen = false;
        let isAudioEnabled = true;
        let history = [];

        // Audio Effects (Web Audio API Synthesizer)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playKeyBeep(type = 'default') {
            if (!isAudioEnabled) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                let freq = 440; // Default note
                if (type === 'op') freq = 587.33; // D5
                if (type === 'action') freq = 329.63; // E4
                if (type === 'equals') freq = 880; // A5

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            const icon = document.getElementById('soundIcon');
            if (isAudioEnabled) {
                icon.className = 'fas fa-volume-up';
                playKeyBeep('default');
            } else {
                icon.className = 'fas fa-volume-mute text-red-400';
            }
        }

        // Display Updating
        const mainDisplay = document.getElementById('mainDisplay');
        const expressionDisplay = document.getElementById('expressionDisplay');

        function updateDisplay() {
            mainDisplay.textContent = currentExpression || '0';
            expressionDisplay.textContent = currentResult !== '0' ? `= ${currentResult}` : '';
        }

        // Key Handlers
        function inputNum(num) {
            playKeyBeep('default');
            if (currentExpression === '0' && num !== '.') {
                currentExpression = num;
            } else {
                currentExpression += num;
            }
            updateDisplay();
        }

        function inputOp(op) {
            playKeyBeep('op');
            if (currentExpression === '' && currentResult !== '0') {
                currentExpression = currentResult;
            }
            const lastChar = currentExpression.slice(-1);
            if (['+', '-', '*', '/', '%'].includes(lastChar)) {
                currentExpression = currentExpression.slice(0, -1) + op;
            } else {
                currentExpression += op;
            }
            updateDisplay();
        }

        function inputDot() {
            playKeyBeep('default');
            const parts = currentExpression.split(/[\+\-\*\/\%]/);
            const lastPart = parts[parts.length - 1];
            if (!lastPart.includes('.')) {
                currentExpression += currentExpression === '' ? '0.' : '.';
            }
            updateDisplay();
        }

        function inputBracket() {
            playKeyBeep('op');
            if (!bracketOpen) {
                currentExpression += '(';
                bracketOpen = true;
            } else {
                currentExpression += ')';
                bracketOpen = false;
            }
            updateDisplay();
        }

        function inputSci(func) {
            playKeyBeep('op');
            switch(func) {
                case 'sin': currentExpression += 'Math.sin('; bracketOpen = true; break;
                case 'cos': currentExpression += 'Math.cos('; bracketOpen = true; break;
                case 'tan': currentExpression += 'Math.tan('; bracketOpen = true; break;
                case 'log': currentExpression += 'Math.log10('; bracketOpen = true; break;
                case 'sqrt': currentExpression += 'Math.sqrt('; bracketOpen = true; break;
                case 'pow': currentExpression += '**2'; break;
                case 'pi': currentExpression += 'Math.PI'; break;
                case 'e': currentExpression += 'Math.E'; break;
            }
            updateDisplay();
        }

        function clearAll() {
            playKeyBeep('action');
            currentExpression = '';
            currentResult = '0';
            bracketOpen = false;
            updateDisplay();
        }

        function deleteLast() {
            playKeyBeep('action');
            currentExpression = currentExpression.slice(0, -1);
            updateDisplay();
        }

        function calculateResult() {
            if (!currentExpression) return;
            playKeyBeep('equals');

            try {
                // Safe Evaluation replacement for basic math
                let sanitizedExp = currentExpression
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/');

                // Evaluate math safely using Function
                let evalResult = new Function(`return ${sanitizedExp}`)();

                if (evalResult !== undefined && !isNaN(evalResult)) {
                    // Format decimals
                    if (typeof evalResult === 'number' && !Number.isInteger(evalResult)) {
                        evalResult = parseFloat(evalResult.toFixed(8));
                    }

                    addHistory(currentExpression, evalResult);
                    currentResult = evalResult.toString();
                    currentExpression = evalResult.toString();
                    updateDisplay();
                } else {
                    throw new Error('Invalid Math');
                }
            } catch (err) {
                mainDisplay.textContent = 'ERROR';
                playKeyBeep('action');
                setTimeout(() => updateDisplay(), 1200);
            }
        }

        // History Management
        function addHistory(expr, res) {
            history.unshift({ expr, res });
            if (history.length > 20) history.pop();
            renderHistory();
        }

        function renderHistory() {
            const historyList = document.getElementById('historyList');
            const emptyHistory = document.getElementById('emptyHistory');

            if (history.length === 0) {
                emptyHistory.style.display = 'block';
                historyList.innerHTML = '';
                historyList.appendChild(emptyHistory);
                return;
            }

            emptyHistory.style.display = 'none';
            historyList.innerHTML = history.map((item, idx) => `
                <div onclick="useHistory(${idx})" class="p-2.5 rounded-lg bg-cyber-dark/90 border border-purple-900/60 hover:border-fuchsia-500 cursor-pointer transition-all hover:shadow-neon-sm group">
                    <div class="text-xs text-purple-400/80 font-mono group-hover:text-purple-300 break-all">${item.expr}</div>
                    <div class="text-sm font-bold text-fuchsia-300 font-orbitron text-right text-glow">= ${item.res}</div>
                </div>
            `).join('');
        }

        function useHistory(index) {
            playKeyBeep('default');
            const item = history[index];
            currentExpression = item.res.toString();
            updateDisplay();
        }

        function clearHistory() {
            playKeyBeep('action');
            history = [];
            renderHistory();
        }

        // Mode Switcher (Basic vs Scientific)
        function setCalcMode(mode) {
            playKeyBeep('default');
            const sciPanel = document.getElementById('scientificPanel');
            const basicBtn = document.getElementById('modeBasicBtn');
            const sciBtn = document.getElementById('modeSciBtn');

            if (mode === 'scientific') {
                sciPanel.classList.remove('hidden');
                sciBtn.className = "px-3 py-1 rounded font-orbitron font-semibold transition-all duration-200 bg-cyber-accent text-white shadow-neon-sm";
                basicBtn.className = "px-3 py-1 rounded font-orbitron font-semibold transition-all duration-200 text-purple-400 hover:text-white";
            } else {
                sciPanel.classList.add('hidden');
                basicBtn.className = "px-3 py-1 rounded font-orbitron font-semibold transition-all duration-200 bg-cyber-accent text-white shadow-neon-sm";
                sciBtn.className = "px-3 py-1 rounded font-orbitron font-semibold transition-all duration-200 text-purple-400 hover:text-white";
            }
        }

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') inputNum(e.key);
            if (['+', '-', '*', '/'].includes(e.key)) inputOp(e.key);
            if (e.key === '.') inputDot();
            if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calculateResult();
            }
            if (e.key === 'Backspace') deleteLast();
            if (e.key === 'Escape') clearAll();
            if (e.key === '(' || e.key === ')') inputBracket();
        });
    </script>
</body>
